<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Systems — Technical Teaching Diagrams</title><link rel="stylesheet" href="diagrams.css"></head><body><main class="wrap"><h1>Computer Systems: Technical Teaching Diagrams</h1><p>Mechanism-specific diagrams for the 21 core manuals.</p><label>Chapter <select id="chapter"></select></label><div class="controls"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button><button id="reset">Reset</button></div><section id="view" class="diagram"></section></main><script>
const C=[
['01 — Transistors and Logic Gates',`<h2>CMOS inverter</h2><div class="row"><div class="box">VDD</div><div class="arrow">↓</div><div class="box">PMOS</div><div class="arrow">↓</div><div class="box state">Y</div><div class="arrow">↓</div><div class="box">NMOS</div><div class="arrow">↓</div><div class="box">GND</div></div><p>Input A controls both gates. A=0 connects Y toward VDD; A=1 connects Y toward GND.</p>`],
['02 — Memory Circuits and Latches',`<h2>Cross-coupled latch</h2><div class="row"><div class="box">Gate A<br>Q = ¬Q̄</div><div class="arrow">↔</div><div class="box">Gate B<br>Q̄ = ¬Q</div></div><div class="row"><div class="box state">Q = 1</div><div class="box state">Q̄ = 0</div></div><p>Feedback creates two stable states.</p>`],
['03 — Dynamic Random-Access Memory',`<h2>1T1C DRAM cell</h2><div class="row"><div class="box">Word line</div><div class="arrow">→</div><div class="box">Access transistor</div><div class="arrow">→</div><div class="box">Storage capacitor</div><div class="arrow">→</div><div class="box">Bit line</div><div class="arrow">→</div><div class="box state">Sense amplifier</div></div><p>Row activation connects cells to bit lines; sensing detects the small voltage difference.</p>`],
['04 — CPU Operation',`<h2>Conceptual datapath</h2><div class="row"><div class="box">PC</div><div class="arrow">→</div><div class="box">Instruction memory</div><div class="arrow">→</div><div class="box">Decoder</div><div class="arrow">→</div><div class="box">Register file</div><div class="arrow">→</div><div class="box state">ALU</div></div><div class="row"><div class="box">ALU</div><div class="arrow">↔</div><div class="box">Data memory</div><div class="arrow">→</div><div class="box">Write-back</div></div>`],
['05 — Clock Signals and Processor Step Sequencing',`<h2>Synchronous state update</h2><div class="row"><div class="box state">State S0</div><div class="arrow">→</div><div class="box">Combinational logic</div><div class="arrow">→</div><div class="box state">State S1</div></div><p class="mono">CLK: _|‾|_|‾|_|‾|_</p><p>State elements update at defined clock events.</p>`],
['06 — CPU Execution',`<h2>Instruction execution</h2><div class="row"><div class="box state">FETCH<br>PC → instruction</div><div class="arrow">→</div><div class="box">DECODE<br>operation + operands</div><div class="arrow">→</div><div class="box">EXECUTE<br>ALU / control flow</div><div class="arrow">→</div><div class="box">MEMORY / WRITE-BACK</div></div>`],
['07 — Variable Sizes and Data Types',`<h2>Bit width</h2><div class="row"><div class="box">8 bits<br>256 patterns</div><div class="arrow">⊂</div><div class="box">16 bits<br>65,536 patterns</div><div class="arrow">⊂</div><div class="box">32 bits<br>2³² patterns</div></div><p>Width determines the number of representable bit patterns; interpretation depends on the data type.</p>`],
['08 — Programs and Processes',`<h2>Program image to process</h2><div class="row"><div class="box">Executable<br>code + data</div><div class="arrow">execve()</div><div class="box state">Process<br>address space + execution state</div><div class="arrow">→</div><div class="box">CPU scheduling</div></div>`],
['09 — Application Binary Interface',`<h2>ABI call boundary</h2><div class="row"><div class="box">Caller</div><div class="arrow">arguments</div><div class="box">ABI-defined<br>registers / stack</div><div class="arrow">→</div><div class="box state">Callee</div><div class="arrow">return value</div><div class="box">Caller</div></div>`],
['10 — The Call Stack',`<h2>Nested stack frames</h2><div class="row"><div class="box">main frame<br>return address</div><div class="arrow">↓ call</div><div class="box">foo frame<br>locals</div><div class="arrow">↓ call</div><div class="box state">bar frame<br>locals</div></div><p>Returning from a call removes its active frame according to the ABI's calling convention.</p>`],
['11 — Heap Allocation',`<h2>Heap regions</h2><div class="row"><div class="box">allocated<br>16 B</div><div class="box">free<br>32 B</div><div class="box">allocated<br>24 B</div><div class="box">free<br>40 B</div></div><p>An allocator manages free and allocated regions. Exact metadata and policies are implementation-specific.</p>`],
['12 — Arrays and Dynamic Collections',`<h2>Array element address</h2><div class="row"><div class="box">Base B</div><div class="arrow">+</div><div class="box">Index i</div><div class="arrow">×</div><div class="box">Element size w</div><div class="arrow">=</div><div class="box state">Address B + i·w</div></div>`],
['13 — Operating System Boundaries',`<h2>User/kernel transition</h2><div class="row"><div class="box">User mode<br>application</div><div class="arrow">system call</div><div class="box state">Kernel mode<br>handler</div><div class="arrow">return</div><div class="box">User mode</div></div><p>Hardware privilege mechanisms constrain privileged operations to kernel execution.</p>`],
['14 — Interrupt Context Saving',`<h2>Interrupt entry and return</h2><div class="row"><div class="box state">Running context</div><div class="arrow">interrupt</div><div class="box">save required context</div><div class="arrow">→</div><div class="box state">handler</div><div class="arrow">→</div><div class="box">restore / return</div></div>`],
['15 — Process Context and Context Switching',`<h2>Thread context switch</h2><div class="row"><div class="box">Thread A<br>registers + stack</div><div class="arrow">save</div><div class="box">scheduler</div><div class="arrow">restore</div><div class="box state">Thread B<br>registers + stack</div></div><p>Threads may share an address space while maintaining separate execution contexts.</p>`],
['16 — Memory Protection',`<h2>Virtual address translation</h2><div class="row"><div class="box">Virtual address<br>VPN | offset</div><div class="arrow">→</div><div class="box">TLB / page table</div><div class="arrow">→</div><div class="box state">Physical address<br>PFN | offset</div></div><div class="row"><div class="box">R/W/X permission</div><div class="arrow">deny →</div><div class="box">page fault</div></div>`],
['17 — CPU Scheduling',`<h2>Runnable selection</h2><div class="row"><div class="box state">P1</div><div class="box">P2</div><div class="box">P3</div><div class="arrow">→ scheduler →</div><div class="box">CPU</div></div><p>The scheduler selects runnable work according to a policy.</p>`],
['18 — Threads and Concurrency',`<h2>Shared process, separate threads</h2><div class="box"><strong>Shared address space</strong><div class="row"><div class="box">code</div><div class="box">globals</div><div class="box">heap</div></div></div><div class="row"><div class="box">Thread A<br>stack + registers</div><div class="box">Thread B<br>stack + registers</div></div>`],
['19 — Race Conditions',`<h2>Lost update</h2><div class="lane"><strong>Thread A</strong><div class="step">load counter = 0</div><div class="step">add 1</div><div class="step">store 1</div></div><div class="lane"><strong>Thread B</strong><div class="step">load counter = 0</div><div class="step">add 1</div><div class="step">store 1</div></div><p>Both threads can read the same old value, producing one stored increment instead of two.</p>`],
['20 — Interprocess Communication',`<h2>Message IPC</h2><div class="row"><div class="box">Process A<br>address space</div><div class="arrow">write</div><div class="box state">IPC object<br>buffer / queue</div><div class="arrow">read</div><div class="box">Process B<br>address space</div></div>`],
['21 — Shells and File-System Objects',`<h2>Pathname resolution</h2><div class="row"><div class="box">Shell<br><span class="mono">cat /etc/hosts</span></div><div class="arrow">parse</div><div class="box">pathname</div><div class="arrow">resolve</div><div class="box">directory entries</div><div class="arrow">→</div><div class="box state">file object</div></div><div class="row"><div class="box">open()</div><div class="arrow">→</div><div class="box">file descriptor</div></div>`]
];let i=0,timer;const sel=document.querySelector('#chapter'),view=document.querySelector('#view');C.forEach((x,n)=>{let o=document.createElement('option');o.value=n;o.textContent=x[0];sel.append(o)});function render(){sel.value=i;view.innerHTML=C[i][1]}function move(d){i=(i+d+C.length)%C.length;render()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#reset').onclick=render;sel.onchange=e=>{i=+e.target.value;render()};document.querySelector('#play').onclick=()=>{clearInterval(timer);timer=setInterval(()=>move(1),4500)};render();</script></body></html>
